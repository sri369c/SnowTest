# Works with `docker compose` and with `podman compose` / `podman-compose`.
# Same network, port and data volume as `./setup.py up` defaults.
# Stages live in a named volume: reachable from other containers only; host-side PUT/GET needs setup.py.
services:
  snowtest:
    build: .
    # setup.py tags from package.json; this fallback is the one place that cannot
    # read it, so bump it here alongside a release (or export SNOWTEST_VERSION).
    image: snowtest:${SNOWTEST_VERSION:-4.3.0}
    ports:
      # Loopback only: the /_snowtest/* control plane is unauthenticated.
      - "127.0.0.1:3030:3030"
    environment:
      SNOWTEST_PORT: "3030"
      # Remove to keep everything in memory (a restart is then a clean slate).
      SNOWTEST_DATA_DIR: /var/lib/snowtest/data
      # Forwarded from the host, because compose has no `--env` equivalent:
      # SNOWTEST_CLOCK=+30m podman compose up -d. Empty means the host clock.
      SNOWTEST_CLOCK: ${SNOWTEST_CLOCK:-}
      # Set to verify key-pair logins; see the README or the running server's /configuration page.
      # SNOWTEST_JWT_PUBLIC_KEY: /keys/rsa_key.pub
    volumes:
      - snowtest-stages:/var/lib/snowtest/stages
      - snowtest-data:/var/lib/snowtest/data
    networks:
      - snowtest-network
    restart: unless-stopped

networks:
  snowtest-network:
    name: snowtest-network
    driver: bridge

volumes:
  snowtest-stages:
    name: snowtest-stages
  snowtest-data:
    name: snowtest-data
