# Works with `docker compose` and with `podman compose` / `podman-compose`.
# The stage volume is a named volume, so podman relabels it for SELinux itself.
# Rootless podman: `setup.py up` binds the stage directory instead and adds
# --userns=keep-id:uid=1000,gid=1000, which is what lets a host-side dbt seed work.
services:
  snowtest:
    build: .
    image: snowtest:1.0.0
    ports:
      - "3030:3030"
    environment:
      SNOWTEST_PORT: "3030"
      # Set to verify key-pair logins; see docs/usage.md.
      # SNOWTEST_JWT_PUBLIC_KEY: /keys/rsa_key.pub
    volumes:
      # Stage directories survive container replacement. To use PUT/GET from a
      # client in another container, mount this volume there at the same path.
      - snowtest-stages:/var/lib/snowtest/stages
    networks:
      - snowtest-network
    restart: unless-stopped

networks:
  snowtest-network:
    name: snowtest-network
    driver: bridge

volumes:
  snowtest-stages:
