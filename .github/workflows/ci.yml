name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    # The one place the pinned versions are read, so a bump in versions.json
    # reaches the jobs below instead of being copied into each of them.
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      connector: ${{ steps.read.outputs.connector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: read
        run: |
          set -eu
          connector=$(node -p "require('./versions.json').connector")
          echo "connector ${connector}"
          echo "connector=${connector}" >> "$GITHUB_OUTPUT"

  node:
    name: node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the DuckDB ICU extension
        shell: bash
        run: |
          # Pinning the session timezone to UTC - and every TIMESTAMPTZ cast -
          # needs DuckDB's ICU extension, and the node bindings do not ship it. A
          # fresh runner has to download 16 MB for it, which is why vitest, with
          # nineteen files starting at once, cannot be the thing that races for
          # it: on windows-latest that race is lost and the suites fail with an
          # ICU error that has nothing to do with the code under test. Install it
          # here, serially, before any test runs.
          for attempt in 1 2 3; do
            if node -e '
              const { DuckDBInstance } = require("@duckdb/node-api");
              (async () => {
                const db = await DuckDBInstance.create(":memory:");
                const connection = await db.connect();
                await connection.run("INSTALL icu");
                await connection.run("LOAD icu");
                console.log("icu ready");
                process.exit(0);
              })().catch((error) => { console.error(error.message); process.exit(1); });
            '; then
              echo "icu installed"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::could not install DuckDB's ICU extension"
          exit 1
      - run: npm run typecheck
      - run: npm test

  connector:
    # The connector version comes from versions.json, resolved by the job above.
    # Python versions are a matrix of their own, because they test the interpreter
    # rather than the connector.
    name: connector ${{ needs.versions.outputs.connector }} on py${{ matrix.python }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run test:py
        env:
          SNOWTEST_CONNECTOR: ${{ needs.versions.outputs.connector }}

  dbt:
    name: dbt suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure python3-venv and openssl are available
        run: python3 -c "import venv, ensurepip" || (sudo apt-get update && sudo apt-get install -y python3-venv openssl)
      - run: npm run test:dbt

  image:
    # Nothing else exercises the Dockerfile or the build flags, and a dropped
    # HEALTHCHECK or a leftover <none> image is invisible to the suites above.
    name: image ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: snowtest:ci
      CONTAINER: ci-snowtest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        if: matrix.engine == 'podman'
        run: |
          sudo apt-get update
          # uidmap provides newuidmap/newgidmap, which rootless podman needs.
          sudo apt-get install -y podman uidmap
          mkdir -p ~/.config/containers
          # VFS needs neither overlayfs support nor fuse, so it works on any
          # runner filesystem; the user config overrides /usr/share/containers.
          printf '[storage]\ndriver = "vfs"\n' > ~/.config/containers/storage.conf
      - name: Check the engine
        run: |
          set -eu
          # The two engines do not share this field: podman keeps the storage
          # driver under .Store, and docker's info has no .Store at all (it
          # reports .Driver). Asking either one for the other's field exits 1.
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman --version
            driver=$(podman info --format '{{.Store.GraphDriverName}}')
            echo "storage driver: $driver"
            # Fail here, with the driver printed, if the vfs config did not apply.
            test "$driver" = "vfs"
          else
            docker --version
            echo "storage driver: $(docker info --format '{{.Driver}}')"
          fi
      - name: Build
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman build --layers=false --format docker -t snowtest:ci .
          else
            docker build -t snowtest:ci .
          fi
      - name: Image list stays clean
        run: |
          test "$(${{ matrix.engine }} image ls --filter dangling=true -q | wc -l)" -eq 0
      - name: Serves /_snowtest/health and reports healthy
        run: |
          set -eu
          engine=${{ matrix.engine }}
          cleanup() {
            code=$?
            if [ "$code" -ne 0 ]; then $engine logs "$CONTAINER" || true; fi
            $engine rm -f "$CONTAINER" || true
            exit "$code"
          }
          trap cleanup EXIT
          $engine run -d --name "$CONTAINER" -p 127.0.0.1:3030:3030 \
            -e SNOWTEST_PORT=3030 "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3030/_snowtest/health; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3030/_snowtest/health; then
            echo "::error::the container never answered /_snowtest/health"
            exit 1
          fi

          # The HEALTHCHECK must be recorded *and* working. Docker keeps it in
          # .Config.Healthcheck, podman at the top level, and the template below
          # errors outright when the image carries none -- so this single
          # behavioural assertion covers both engines without pinning a layout.
          for _ in $(seq 1 40); do
            status=$($engine inspect "$CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::the container never became healthy: no working HEALTHCHECK in the image"
          $engine image inspect "$IMAGE" | head -40
          exit 1
